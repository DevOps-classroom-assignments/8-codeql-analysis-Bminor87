name: CodeQL + Docker CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze:
    name: CodeQL Analysis
    # Use ubuntu-latest for the analysis job
    runs-on: ubuntu-latest
    # Define permissions for the job
    permissions:
      security-events: write
      packages: read
    # Define language to be analyzed
    strategy:
      fail-fast: false
      matrix:
        include:
        - language: go

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"

  docker:
    name: Docker Build & Run
    runs-on: ubuntu-latest
    needs: analyze

    # Define steps to build and run the Docker container
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t go-web-server .

      - name: Run Docker container
        run: docker run -dp 8080:8080 --name go-web-server go-web-server

      - name: Wait for server to start
        run: sleep 20

      - name: Test the endpoint
        run: curl "http://localhost:8080/readfile?file=hello.txt"

      - name: Stop Docker container
        run: docker stop go-web-server
